<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Code Mode Agent</title>
  <meta name="description" content="An AI agent that writes and executes code to answer your questions using MCP tools in a sandboxed Cloudflare Worker." />
  <meta name="theme-color" content="#0a0c14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    /* ── Design Tokens ───────────────────────────────────────────── */
    :root {
      --bg-base:      #0a0c14;
      --bg-surface:   #111420;
      --bg-elevated:  #181c2e;
      --bg-card:      #1e2338;
      --bg-input:     #141828;

      --border:       rgba(255,255,255,0.07);
      --border-hover: rgba(255,255,255,0.14);

      --accent:       #7c6af7;
      --accent-glow:  rgba(124,106,247,0.35);
      --accent-soft:  rgba(124,106,247,0.12);
      --accent-2:     #5eead4;
      --accent-2-soft:rgba(94,234,212,0.12);

      --text-primary:   #e8eaf6;
      --text-secondary: #8b92b8;
      --text-muted:     #525880;
      --text-code:      #a5b4fc;

      --success: #22c55e;
      --error:   #ef4444;
      --warn:    #f59e0b;

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --radius-xl: 20px;

      --sidebar-w: 300px;
      --font-sans: 'Inter', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
    }

    /* ── Reset ───────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: var(--font-sans);
      background: var(--bg-base);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
    }

    /* ── Scrollbar ───────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

    /* ── Top Bar ─────────────────────────────────────────────────── */
    #topbar {
      height: 56px;
      min-height: 56px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 12px;
      z-index: 10;
      flex-shrink: 0;
    }

    .logo-mark {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, var(--accent), #4f46e5);
      border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; font-weight: 700; color: #fff; letter-spacing: -0.5px;
      flex-shrink: 0;
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .logo-text {
      font-size: 15px; font-weight: 600; color: var(--text-primary);
    }
    .logo-sub {
      font-size: 12px; color: var(--text-muted);
      margin-left: 2px;
    }

    .topbar-spacer { flex: 1; }

    #status-badge {
      display: flex; align-items: center; gap: 6px;
      font-size: 12px; color: var(--text-secondary);
      padding: 4px 10px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 99px;
    }
    .status-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--text-muted);
      transition: background 0.3s;
    }
    .status-dot.online  { background: var(--success); box-shadow: 0 0 6px var(--success); }
    .status-dot.loading { background: var(--warn); animation: pulse 1s infinite; }
    .status-dot.error   { background: var(--error); }

    @keyframes pulse {
      0%,100% { opacity: 1; } 50% { opacity: 0.4; }
    }

    /* ── Main Layout ─────────────────────────────────────────────── */
    #main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* ── Sidebar ─────────────────────────────────────────────────── */
    #sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      background: var(--bg-surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .auth-button {
      margin-left: auto;
      border: 1px solid var(--border-hover);
      border-radius: var(--radius-sm);
      background: var(--accent-soft);
      color: var(--text-primary);
      padding: 6px 9px;
      font: 500 11px var(--font-sans);
      cursor: pointer;
      white-space: nowrap;
    }
    .auth-button:hover { border-color: var(--accent); }

    .sidebar-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
    }

    #tool-count {
      margin-left: auto;
      font-size: 11px;
      background: var(--accent-soft);
      color: var(--accent);
      border-radius: 99px;
      padding: 2px 8px;
      font-weight: 600;
    }

    #mcp-server-tag {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
    }

    #mcp-server-tag span {
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      color: var(--text-secondary);
    }

    #tools-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .tool-card {
      padding: 10px 12px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .tool-card:hover {
      background: var(--bg-card);
      border-color: var(--border);
    }
    .tool-card.active {
      background: var(--accent-soft);
      border-color: rgba(124,106,247,0.3);
    }

    .tool-name {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 500;
      color: var(--text-code);
      margin-bottom: 3px;
    }
    .tool-card.active .tool-name { color: var(--accent); }

    .tool-sig {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .tool-desc {
      font-size: 11px;
      color: var(--text-secondary);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .tools-loading, .tools-error {
      padding: 20px 16px;
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
    }
    .tools-error { color: var(--error); }

    /* Skeleton loader */
    .skeleton {
      background: linear-gradient(90deg, var(--bg-card) 25%, var(--bg-elevated) 50%, var(--bg-card) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: var(--radius-sm);
    }
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    .skeleton-tool {
      padding: 10px 12px;
      border-radius: var(--radius-md);
      margin-bottom: 4px;
    }
    .skeleton-line {
      height: 10px;
      border-radius: 4px;
      margin-bottom: 6px;
    }

    /* ── Chat Area ───────────────────────────────────────────────── */
    #chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg-base);
    }

    /* Empty state */
    #empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 32px;
    }

    .empty-icon {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, var(--accent-soft), var(--accent-2-soft));
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
    }

    .empty-title {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .empty-sub {
      font-size: 14px;
      color: var(--text-muted);
      max-width: 380px;
      text-align: center;
      line-height: 1.6;
    }

    .example-prompts {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      max-width: 460px;
    }

    .example-prompt {
      padding: 10px 14px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: left;
    }
    .example-prompt:hover {
      border-color: var(--accent);
      color: var(--text-primary);
      background: var(--accent-soft);
    }

    /* Messages */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 0;
      display: none; /* hidden until first message */
    }
    #messages.has-messages {
      display: block;
    }

    .message {
      max-width: 820px;
      margin: 0 auto 20px;
      padding: 0 24px;
      animation: fadeSlideIn 0.2s ease;
    }
    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .message-avatar {
      width: 26px; height: 26px; border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; flex-shrink: 0;
    }
    .message-avatar.user {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
    }
    .message-avatar.assistant {
      background: linear-gradient(135deg, var(--accent), #4f46e5);
      color: #fff;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .message-role {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .message-time {
      font-size: 11px;
      color: var(--text-muted);
      margin-left: auto;
    }

    .message-body {
      font-size: 14px;
      line-height: 1.7;
      color: var(--text-primary);
    }

    .message.user .message-body {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 16px;
    }

    /* Inline code */
    .message-body code {
      font-family: var(--font-mono);
      font-size: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 1px 5px;
      color: var(--text-code);
    }

    .data-chart {
      margin: 14px 0;
      padding: 16px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
    }
    .data-chart-title { font-size: 13px; font-weight: 600; margin-bottom: 14px; }
    .chart-row { display: grid; grid-template-columns: minmax(90px, 1fr) minmax(100px, 2fr) auto; gap: 10px; align-items: center; margin: 9px 0; }
    .chart-label, .chart-value { font-size: 11px; color: var(--text-secondary); }
    .chart-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chart-value { color: var(--text-primary); font-variant-numeric: tabular-nums; }
    .chart-track { height: 10px; background: var(--bg-card); border-radius: 99px; overflow: hidden; }
    .chart-bar { height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
    .donut-layout { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
    .donut-ring { width: 150px; height: 150px; border-radius: 50%; position: relative; flex: 0 0 auto; }
    .donut-ring::after { content: ''; position: absolute; inset: 27px; border-radius: 50%; background: var(--bg-surface); border: 1px solid var(--border); }
    .donut-legend { display: grid; gap: 8px; min-width: min(220px, 100%); }
    .donut-item { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text-secondary); }
    .donut-swatch { width: 9px; height: 9px; border-radius: 3px; flex: 0 0 auto; }
    .donut-item strong { margin-left: auto; color: var(--text-primary); font-variant-numeric: tabular-nums; }
    @media (max-width: 600px) { .chart-row { grid-template-columns: 1fr auto; gap: 6px 10px; } .chart-track { grid-column: 1 / -1; grid-row: 2; } }

    /* Code execution block */
    .code-block {
      margin: 12px 0;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      background: var(--bg-surface);
    }

    .code-block-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .code-block-header .lang-badge {
      background: var(--accent-soft);
      color: var(--accent);
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 10px;
    }
    .copy-btn {
      margin-left: auto;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      transition: all 0.15s;
      font-family: var(--font-sans);
    }
    .copy-btn:hover { color: var(--text-primary); background: var(--border); }

    .code-block pre {
      font-family: var(--font-mono);
      font-size: 12.5px;
      line-height: 1.6;
      color: var(--text-primary);
      padding: 14px 16px;
      overflow-x: auto;
      white-space: pre;
    }

    /* Execution result */
    .exec-result {
      margin: 8px 0 12px;
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 1px solid rgba(94,234,212,0.2);
    }
    .exec-result-header {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      background: rgba(94,234,212,0.07);
      border-bottom: 1px solid rgba(94,234,212,0.15);
      font-size: 11px;
      font-weight: 600;
      color: var(--accent-2);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .exec-result pre {
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.6;
      color: var(--text-secondary);
      padding: 12px 14px;
      overflow-x: auto;
      background: var(--bg-surface);
    }

    /* Logs block */
    .logs-block {
      margin: 6px 0;
      border-radius: var(--radius-md);
      border: 1px solid rgba(245,158,11,0.2);
      overflow: hidden;
    }
    .logs-header {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 14px;
      background: rgba(245,158,11,0.07);
      border-bottom: 1px solid rgba(245,158,11,0.15);
      font-size: 11px; font-weight: 600;
      color: var(--warn);
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .logs-block pre {
      font-family: var(--font-mono); font-size: 12px;
      color: #d1aa7a; padding: 10px 14px;
      background: var(--bg-surface); overflow-x: auto;
    }

    /* Typing indicator */
    .typing-indicator {
      display: flex; gap: 4px; align-items: center;
      padding: 4px 0;
    }
    .typing-indicator span {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent);
      animation: bounce 1.2s infinite;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%,80%,100% { transform: translateY(0); opacity: 0.5; }
      40%          { transform: translateY(-5px); opacity: 1; }
    }

    /* ── Input Area ──────────────────────────────────────────────── */
    #input-area {
      padding: 16px 24px 20px;
      border-top: 1px solid var(--border);
      background: var(--bg-base);
      max-width: 820px;
      margin: 0 auto;
      width: 100%;
    }

    #input-wrap {
      position: relative;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 12px 14px;
      transition: border-color 0.2s;
    }
    #input-wrap:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    #user-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      resize: none;
      font-family: var(--font-sans);
      font-size: 14px;
      color: var(--text-primary);
      line-height: 1.5;
      max-height: 160px;
      min-height: 24px;
      overflow-y: auto;
    }
    #user-input::placeholder { color: var(--text-muted); }

    #send-btn {
      width: 36px; height: 36px; flex-shrink: 0;
      background: linear-gradient(135deg, var(--accent), #4f46e5);
      border: none;
      border-radius: var(--radius-sm);
      color: #fff;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
      box-shadow: 0 2px 12px var(--accent-glow);
    }
    #send-btn:hover:not(:disabled) {
      transform: scale(1.05);
      box-shadow: 0 4px 20px var(--accent-glow);
    }
    #send-btn:disabled {
      opacity: 0.4; cursor: not-allowed;
      box-shadow: none;
    }
    #send-btn svg { width: 16px; height: 16px; }

    #input-hint {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 8px;
      text-align: center;
    }
    #input-hint kbd {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0 4px;
      font-family: var(--font-mono);
      font-size: 10px;
    }

    /* ── Tool Detail Tooltip ─────────────────────────────────────── */
    #tool-detail {
      display: none;
      position: fixed;
      z-index: 100;
      background: var(--bg-elevated);
      border: 1px solid var(--border-hover);
      border-radius: var(--radius-md);
      padding: 14px;
      max-width: 340px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
      pointer-events: none;
    }
    #tool-detail.visible { display: block; }
    .td-name { font-family: var(--font-mono); font-size: 13px; font-weight: 500; color: var(--accent); margin-bottom: 6px; }
    .td-sig  { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); margin-bottom: 8px; word-break: break-all; }
    .td-desc { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }

    /* ── Responsive ──────────────────────────────────────────────── */
    @media (max-width: 700px) {
      #topbar { padding: 0 12px; gap: 8px; }
      .logo-sub { display: none; }
      #status-badge { padding: 4px 7px; font-size: 11px; }
      .auth-button { padding: 6px 8px; font-size: 10px; }
      #sidebar { display: none; }
      .message { padding: 0 16px; }
      #input-area { padding: 12px 16px 16px; }
    }
  </style>
</head>
<body>

<!-- Top Bar -->
<header id="topbar">
  <div class="logo-mark">⌘</div>
  <div>
    <div class="logo-text">Code Mode</div>
    <div class="logo-sub">MCP → TypeScript → Sandboxed Worker</div>
  </div>
  <div class="topbar-spacer"></div>
  <button id="auth-button" class="auth-button" type="button">Connect INDmoney</button>
  <div id="status-badge">
    <div class="status-dot" id="status-dot"></div>
    <span id="status-text">Connecting…</span>
  </div>
</header>

<!-- Main -->
<div id="main">

  <!-- Sidebar: Tools -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">MCP Tools</span>
      <span id="tool-count" style="display:none"></span>
    </div>
    <div id="mcp-server-tag">
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
      <span id="mcp-server-url">Loading…</span>
    </div>
    <div id="tools-list">
      <!-- Skeletons -->
      <div class="skeleton-tool skeleton"><div class="skeleton-line" style="width:70%"></div><div class="skeleton-line" style="width:90%"></div><div class="skeleton-line" style="width:55%"></div></div>
      <div class="skeleton-tool skeleton"><div class="skeleton-line" style="width:80%"></div><div class="skeleton-line" style="width:60%"></div></div>
      <div class="skeleton-tool skeleton"><div class="skeleton-line" style="width:65%"></div><div class="skeleton-line" style="width:75%"></div><div class="skeleton-line" style="width:40%"></div></div>
    </div>
  </aside>

  <!-- Chat -->
  <section id="chat-area">

    <!-- Empty state -->
    <div id="empty-state">
      <div class="empty-icon">🤖</div>
      <div>
        <div class="empty-title">Code Mode Agent</div>
        <div class="empty-sub" style="margin-top:8px">
          The agent writes JavaScript that calls a typed MCP API, then executes it
          in a sandboxed Cloudflare Worker — no direct tool calls, no context bloat.
        </div>
      </div>
      <div class="example-prompts">
        <button class="example-prompt" data-prompt="Summarize my portfolio allocation by asset class.">📊 Summarize my portfolio allocation</button>
        <button class="example-prompt" data-prompt="Show my top holdings by current value and explain the largest concentration.">💼 Review my top holdings</button>
        <button class="example-prompt" data-prompt="List my active SIPs and their monthly amounts.">📈 List my active SIPs</button>
      </div>
    </div>

    <!-- Messages container -->
    <div id="messages"></div>

    <!-- Input -->
    <div id="input-area">
      <div id="input-wrap">
        <textarea id="user-input" rows="1" placeholder="Ask the agent anything… it will write and run code to answer you." aria-label="Message input"></textarea>
        <button id="send-btn" title="Send message (Enter)" aria-label="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
      <div id="input-hint"><kbd>Enter</kbd> to send · <kbd>Shift+Enter</kbd> for new line</div>
    </div>

  </section>
</div>

<!-- Tool detail tooltip -->
<div id="tool-detail">
  <div class="td-name" id="td-name"></div>
  <div class="td-sig" id="td-sig"></div>
  <div class="td-desc" id="td-desc"></div>
</div>

<script>
/* ── State ─────────────────────────────────────────────────────────── */
let tools = [];
let isStreaming = false;

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch((error) => {
    console.warn('The app shell could not be cached for offline use:', error);
  }));
}

/* ── DOM refs ──────────────────────────────────────────────────────── */
const statusDot  = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');
const toolCount  = document.getElementById('tool-count');
const mcpUrl     = document.getElementById('mcp-server-url');
const toolsList  = document.getElementById('tools-list');
const emptyState = document.getElementById('empty-state');
const messages   = document.getElementById('messages');
const userInput  = document.getElementById('user-input');
const sendBtn    = document.getElementById('send-btn');
const toolDetail = document.getElementById('tool-detail');
const authButton = document.getElementById('auth-button');
let isConnected = false;

/* ── Status helpers ─────────────────────────────────────────────────── */
function setStatus(state, label) {
  statusDot.className = 'status-dot ' + state;
  statusText.textContent = label;
}

/* ── Load MCP tools from /api/tools ─────────────────────────────────── */
async function loadTools() {
  try {
    const res = await fetch('/api/tools');
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error([data.error, data.details].filter(Boolean).join(': ') || `HTTP ${res.status}`);

    tools = data.tools || [];
    isConnected = data.connected === true;
    authButton.textContent = isConnected ? 'Disconnect' : 'Connect INDmoney';
    authButton.title = isConnected ? 'Disconnect your INDmoney account' : 'Sign in securely with INDmoney';
    toolCount.textContent = tools.length;
    toolCount.style.display = '';

    // Display the MCP server URL (shortened)
    const url = data.mcpServer || '';
    mcpUrl.title = url;
    mcpUrl.textContent = url.replace(/^https?:\/\//, '');

    if (isConnected) {
      renderTools();
      setStatus('online', `${tools.length} tools loaded`);
    } else {
      toolsList.innerHTML = '<div class="tools-loading">Connect your INDmoney account to load your tools.</div>';
      setStatus('', 'Not connected');
    }
  } catch (err) {
    toolsList.innerHTML = `<div class="tools-error">⚠ Failed to load tools<br><small>${err.message}</small></div>`;
    setStatus('error', 'Connection failed');
  }
}

authButton.addEventListener('click', async () => {
  if (!isConnected) {
    window.location.assign('/auth/indmoney/connect');
    return;
  }
  authButton.disabled = true;
  try {
    await fetch('/auth/indmoney/disconnect', { method: 'POST' });
    await loadTools();
  } finally {
    authButton.disabled = false;
  }
});

function renderTools() {
  if (!tools.length) {
    toolsList.innerHTML = '<div class="tools-loading">No tools found</div>';
    return;
  }
  toolsList.innerHTML = '';
  tools.forEach((t, i) => {
    const card = document.createElement('div');
    card.className = 'tool-card';
    card.innerHTML = `
      <div class="tool-name">${escHtml(t.name)}</div>
      <div class="tool-sig">${escHtml(t.tsSignature || '')}</div>
      <div class="tool-desc">${escHtml(t.description || '')}</div>
    `;
    card.addEventListener('mouseenter', (e) => showToolDetail(t, e));
    card.addEventListener('mouseleave', hideToolDetail);
    toolsList.appendChild(card);
  });
}

/* ── Tool detail tooltip ─────────────────────────────────────────────── */
function showToolDetail(tool, e) {
  document.getElementById('td-name').textContent = tool.name;
  document.getElementById('td-sig').textContent = `codemode.${tool.name}${tool.tsSignature || '()'}`;
  document.getElementById('td-desc').textContent = tool.description || '';

  const rect = e.target.getBoundingClientRect();
  const sidebar = document.getElementById('sidebar').getBoundingClientRect();
  toolDetail.style.left = (sidebar.right + 10) + 'px';
  toolDetail.style.top  = Math.min(rect.top, window.innerHeight - 200) + 'px';
  toolDetail.classList.add('visible');
}
function hideToolDetail() { toolDetail.classList.remove('visible'); }

/* ── Chat ────────────────────────────────────────────────────────────── */
function showMessages() {
  emptyState.style.display = 'none';
  messages.classList.add('has-messages');
}

function timeStr() {
  return new Date().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
}

function addMessage(role, content) {
  showMessages();
  const div = document.createElement('div');
  div.className = `message ${role}`;
  const avatar = role === 'user' ? 'U' : '⌘';
  const label  = role === 'user' ? 'You' : 'Agent';
  div.innerHTML = `
    <div class="message-header">
      <div class="message-avatar ${role}">${avatar}</div>
      <div class="message-role">${label}</div>
      <div class="message-time">${timeStr()}</div>
    </div>
    <div class="message-body">${content}</div>
  `;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
  return div;
}

function addTypingIndicator() {
  showMessages();
  const div = document.createElement('div');
  div.className = 'message assistant';
  div.id = 'typing-indicator';
  div.innerHTML = `
    <div class="message-header">
      <div class="message-avatar assistant">⌘</div>
      <div class="message-role">Agent</div>
    </div>
    <div class="message-body">
      <div class="typing-indicator"><span></span><span></span><span></span></div>
    </div>
  `;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
  return div;
}

function removeTypingIndicator() {
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

/* ── Streaming response handler ──────────────────────────────────────── */
async function sendMessage(text) {
  if (!text.trim() || isStreaming) return;
  isStreaming = true;
  sendBtn.disabled = true;
  setStatus('loading', 'Thinking…');

  addMessage('user', escHtml(text).replace(/\n/g, '<br>'));
  userInput.value = '';
  autoResize();

  const typingDiv = addTypingIndicator();

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text }),
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({ error: `HTTP ${res.status}` }));
      if (err.loginUrl) {
        const connectLink = `<br><a href="${escHtml(err.loginUrl)}" style="color:var(--accent-2)">Connect INDmoney</a>`;
        throw Object.assign(new Error(err.error || 'Connect your INDmoney account.'), { connectLink });
      }
      throw new Error([err.error, err.details].filter(Boolean).join(': ') || `HTTP ${res.status}`);
    }

    removeTypingIndicator();
    const msgDiv = addMessage('assistant', '');
    const bodyDiv = msgDiv.querySelector('.message-body');
    bodyDiv.innerHTML = '';

    // Stream and parse the response
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let rawText = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      
      const chunk = decoder.decode(value, { stream: true });
      rawText += chunk;
      
      // Render the accumulated text as it comes in
      bodyDiv.innerHTML = renderMarkdown(rawText.trim());
      messages.scrollTop = messages.scrollHeight;
    }

    if (rawText.trim() === '') {
      bodyDiv.innerHTML = '<em>The model returned no text. Check the Worker logs for the provider error.</em>';
    }

    setStatus('online', `${tools.length} tools ready`);
  } catch (err) {
    removeTypingIndicator();
    addMessage('assistant',
      `<span style="color:var(--error)">⚠ Error: ${escHtml(err.message)}</span>${err.connectLink || ''}`
    );
    setStatus('error', 'Request failed');
  } finally {
    isStreaming = false;
    sendBtn.disabled = false;
    messages.scrollTop = messages.scrollHeight;
  }
}

/* ── Markdown renderer (minimal) ─────────────────────────────────────── */
function renderMarkdown(text) {
  // Escape helper
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  // Extract chart blocks first so the agent can return data-driven visuals.
  const chartBlocks = [];
  text = text.replace(/```chart\s*\n([\s\S]*?)```/gi, (_, json) => {
    const idx = chartBlocks.length;
    chartBlocks.push(parseChartSpec(json));
    return `\x00CHART${idx}\x00`;
  });

  // Some model responses wrap the same JSON in bold Markdown instead of a
  // chart fence. Recognize that shape too and render it as a chart.
  text = text.replace(/\*\*\s*(\{[\s\S]*?\})\s*\*\*/g, (whole, json) => {
    const spec = parseChartSpec(json);
    if (!spec) return whole;
    const idx = chartBlocks.length;
    chartBlocks.push(spec);
    return `\x00CHART${idx}\x00`;
  });

  // Extract and replace code blocks
  const codeBlocks = [];
  text = text.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    const idx = codeBlocks.length;
    codeBlocks.push({ lang: lang || 'js', code: code.trimEnd() });
    return `\x00CODE${idx}\x00`;
  });

  // Process inline elements
  text = esc(text);

  // Inline code
  text = text.replace(/`([^`]+)`/g, '<code>$1</code>');

  // Bold/italic
  text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');

  // Links
  text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:underline">$1</a>');

  // Line breaks & paragraphs
  text = text.replace(/\n\n/g, '</p><p style="margin-top:12px">');
  text = text.replace(/\n/g, '<br>');
  text = '<p>' + text + '</p>';

  // Restore code blocks with syntax highlighting
  text = text.replace(/\x00CODE(\d+)\x00/g, (_, idx) => {
    const { lang, code } = codeBlocks[idx];
    const highlighted = highlightCode(code);
    const btnId = 'copy-' + Math.random().toString(36).slice(2);
    return `
      <div class="code-block">
        <div class="code-block-header">
          <span class="lang-badge">${esc(lang || 'code')}</span>
          Generated Code
          <button class="copy-btn" id="${btnId}" onclick="copyCode(this, ${JSON.stringify(code)})">Copy</button>
        </div>
        <pre>${highlighted}</pre>
      </div>`;
  });

  text = text.replace(/\x00CHART(\d+)\x00/g, (_, idx) => renderDataChart(chartBlocks[idx]));

  // Detect result JSON blocks (wrapped in triple backtick or plain)
  // The agent may send result sections prefixed with "Result:" or "Output:"
  text = text.replace(/<p>(<strong>)?(?:Result|Output|Execution Result):?(<\/strong>)?\s*<\/p>/gi,
    '<div class="exec-result-header">⬡ Execution Result</div>');

  return text;
}

function parseChartSpec(json) {
  try {
    // Normalize HTML-encoded spaces/quotes that occasionally appear in model output.
    const normalized = String(json)
      .replace(/&#x20;|&#32;/gi, ' ')
      .replace(/&quot;/gi, '"')
      .replace(/&amp;/gi, '&');
    const spec = JSON.parse(normalized);
    return spec && ['bar', 'donut'].includes(spec.type) && Array.isArray(spec.data) ? spec : null;
  } catch {
    return null;
  }
}

function renderDataChart(spec) {
  if (!spec || !['bar', 'donut'].includes(spec.type) || !Array.isArray(spec.data)) return '';
  const rows = spec.data.slice(0, 12).map(item => ({
    label: String(item?.label ?? '').slice(0, 80),
    value: Number(item?.value),
  })).filter(item => item.label && Number.isFinite(item.value) && item.value >= 0);
  if (!rows.length) return '';

  const esc = escHtml;
  const title = esc(String(spec.title || 'Data visualization').slice(0, 120));
  const unit = String(spec.unit || '').slice(0, 12);
  const formatValue = value => `${esc(unit)}${new Intl.NumberFormat('en-IN', { maximumFractionDigits: 2 }).format(value)}`;
  let visualization;

  if (spec.type === 'bar') {
    const max = Math.max(...rows.map(row => row.value), 1);
    visualization = rows.map(row => `
      <div class="chart-row" title="${esc(row.label)}: ${formatValue(row.value)}">
        <span class="chart-label">${esc(row.label)}</span>
        <div class="chart-track"><div class="chart-bar" style="width:${Math.max(row.value / max * 100, row.value ? 2 : 0)}%"></div></div>
        <span class="chart-value">${formatValue(row.value)}</span>
      </div>`).join('');
  } else {
    const colors = ['#7c6af7', '#5eead4', '#60a5fa', '#f59e0b', '#f472b6', '#a3e635', '#fb7185', '#38bdf8', '#c084fc', '#34d399', '#f97316', '#94a3b8'];
    const total = rows.reduce((sum, row) => sum + row.value, 0);
    if (!total) return '';
    let cursor = 0;
    const stops = rows.map((row, i) => {
      const start = cursor;
      cursor += row.value / total * 100;
      return `${colors[i % colors.length]} ${start}% ${cursor}%`;
    }).join(',');
    visualization = `<div class="donut-layout"><div class="donut-ring" role="img" aria-label="${title}" style="background:conic-gradient(${stops})"></div><div class="donut-legend">${rows.map((row, i) => `
      <div class="donut-item"><span class="donut-swatch" style="background:${colors[i % colors.length]}"></span><span>${esc(row.label)}</span><strong>${formatValue(row.value)}</strong></div>`).join('')}
      </div></div>`;
  }
  return `<figure class="data-chart"><figcaption class="data-chart-title">${title}</figcaption>${visualization}</figure>`;
}

/* ── Minimal syntax highlighter ──────────────────────────────────────── */
function highlightCode(code) {
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  let s = esc(code);

  // Strings
  s = s.replace(/(&#39;[^&#]*&#39;|&quot;[^&]*&quot;|`[^`]*`)/g,
    '<span style="color:#86efac">$1</span>');

  // Keywords
  const kw = ['const','let','var','async','await','function','return','if','else',
    'for','while','try','catch','throw','new','import','export','from','class',
    'extends','typeof','instanceof','null','undefined','true','false','this'];
  kw.forEach(k => {
    s = s.replace(new RegExp(`\\b(${k})\\b`, 'g'),
      '<span style="color:#c084fc">$1</span>');
  });

  // Comments
  s = s.replace(/(\/\/[^\n]*)/g, '<span style="color:#6b7280;font-style:italic">$1</span>');

  // Numbers
  s = s.replace(/\b(\d+\.?\d*)\b/g, '<span style="color:#fb923c">$1</span>');

  // Function calls
  s = s.replace(/\b([a-zA-Z_$][a-zA-Z0-9_$]*)\s*\(/g,
    '<span style="color:#67e8f9">$1</span>(');

  // Properties after dot
  s = s.replace(/\.([a-zA-Z_$][a-zA-Z0-9_$]*)/g,
    '.<span style="color:#fcd34d">$1</span>');

  return s;
}

/* ── Copy code ───────────────────────────────────────────────────────── */
function copyCode(btn, code) {
  navigator.clipboard.writeText(code).then(() => {
    btn.textContent = '✓ Copied';
    setTimeout(() => { btn.textContent = 'Copy'; }, 2000);
  });
}

/* ── Escape HTML ────────────────────────────────────────────────────── */
function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ── Textarea auto-resize ────────────────────────────────────────────── */
function autoResize() {
  userInput.style.height = 'auto';
  userInput.style.height = Math.min(userInput.scrollHeight, 160) + 'px';
}
userInput.addEventListener('input', autoResize);

/* ── Keyboard handler ────────────────────────────────────────────────── */
userInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage(userInput.value);
  }
});

/* ── Send button ─────────────────────────────────────────────────────── */
sendBtn.addEventListener('click', () => sendMessage(userInput.value));

/* ── Example prompts ─────────────────────────────────────────────────── */
document.querySelectorAll('.example-prompt').forEach(btn => {
  btn.addEventListener('click', () => {
    const prompt = btn.dataset.prompt;
    userInput.value = prompt;
    autoResize();
    sendMessage(prompt);
  });
});

/* ── Init ────────────────────────────────────────────────────────────── */
loadTools();
userInput.focus();
</script>
</body>
</html>
