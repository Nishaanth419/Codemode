name = "code-mode-agent"
main = "src/index.ts"
compatibility_date = "2026-09-25"

# Treat .html files as plain-text modules so they can be imported as strings
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = false

# Worker Loader binding — enables spinning up Dynamic Workers at runtime.
# Each code snippet the LLM generates gets its own isolated V8 isolate.
# Docs: https://developers.cloudflare.com/dynamic-workers/getting-started/
[[worker_loaders]]
binding = "LOADER"

# Environment variables — set these via `wrangler secret put` or .env
# OPENAI_API_KEY is required for the LLM calls via Vercel AI SDK.
[vars]
# MCP_SERVER_URL is the SSE-based MCP server we connect to for tool schemas.
# Default: Cloudflare Agents docs GitMCP server.
MCP_SERVER_URL = "https://mcp.indmoney.com/mcp"
